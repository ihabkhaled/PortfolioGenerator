version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      eslint:
        patterns:
          - 'eslint*'
          - '@eslint/*'
          - 'typescript-eslint'
          - '@typescript-eslint/*'
          - '@vitest/eslint-plugin'
          - '@next/eslint-plugin-next'
      testing:
        patterns:
          - 'vitest'
          - '@vitest/*'
          - '@testing-library/*'
          - '@playwright/test'
          - 'axe-core'
          - '@axe-core/*'
          - 'jsdom'
      next:
        patterns:
          - 'next'
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
      data:
        patterns:
          - 'prisma'
          - '@prisma/*'
          - 'zod'
      ai:
        patterns:
          - 'ai'
          - '@ai-sdk/*'
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
