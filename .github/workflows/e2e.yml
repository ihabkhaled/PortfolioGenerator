name: E2E

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright (golden path, adversarial, accessibility)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: portfolio_generate_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/portfolio_generate_e2e
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
      NEXT_PUBLIC_APP_ENV: local
      BETTER_AUTH_SECRET: ci-only-not-a-real-secret-ci-only-not-a-real
      BETTER_AUTH_URL: http://127.0.0.1:3100
      # CI must never reach a paid model: the deterministic provider is the
      # only extraction backend the E2E suite is allowed to use.
      AI_PROVIDER: deterministic
      STORAGE_DRIVER: local

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24.18.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Migrate from an empty database
        run: npm run db:migrate:deploy

      - name: Install Playwright browsers
        run: npm exec -- playwright install --with-deps chromium

      - name: E2E and accessibility suites
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
