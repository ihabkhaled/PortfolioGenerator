services:
  clamav:
    image: clamav/clamav:1.4_base
    restart: unless-stopped
    init: true
    environment:
      CLAMAV_NO_MILTERD: 'true'
    volumes:
      - signatures:/var/lib/clamav
    expose:
      - '3310'
    healthcheck:
      test: ['CMD-SHELL', 'clamdcheck.sh']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 2m
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 3G
    networks:
      - scanner

  tcp-proxy:
    image: haproxy:3.2-alpine
    restart: unless-stopped
    depends_on:
      clamav:
        condition: service_healthy
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - '${CLAMAV_BIND_ADDRESS:-127.0.0.1}:${CLAMAV_BIND_PORT:-3310}:3310'
    networks:
      - scanner

volumes:
  signatures:

networks:
  scanner:
    internal: true
